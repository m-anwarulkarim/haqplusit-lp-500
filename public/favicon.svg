<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Cyan Plus Gradient -->
    <linearGradient id="plus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Letter H (Pure Crisp White) -->
  <!-- Left Pillar -->
  <rect x="25" y="32" width="16" height="64" rx="8" fill="#ffffff" />
  <!-- Center Bar -->
  <rect x="25" y="56" width="44" height="16" rx="6" fill="#ffffff" />
  <!-- Right Pillar -->
  <rect x="53" y="32" width="16" height="64" rx="8" fill="#ffffff" />

  <!-- Tech Plus Symbol (+) in Electric Cyan -->
  <!-- Vertical Bar -->
  <rect x="88.5" y="46" width="13" height="36" rx="6.5" fill="url(#plus)" />
  <!-- Horizontal Bar -->
  <rect x="77" y="57.5" width="36" height="13" rx="6.5" fill="url(#plus)" />
</svg>
